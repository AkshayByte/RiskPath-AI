# Production reverse proxy for the Vite SPA with Security Headers.
# - Serves the built frontend (same origin, so no CORS issues).
# - Proxies /api/* to the backend Compose service.
# - Falls back to index.html for React Router client-side routes.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 15M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000;" always;

    # Backend API (Compose service name; NOT localhost).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: serve index.html for unknown paths.
    # NOTE: $uri/ is deliberately omitted to prevent collide with /assets SPA route.
    location / {
        try_files $uri /index.html;
    }
}
