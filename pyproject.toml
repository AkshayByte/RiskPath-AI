[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskpath-ai"
version = "0.1.0"
description = "Graph-based cybersecurity analytics platform for context-aware vulnerability prioritization, multi-hop attack path discovery, what-if remediation simulation, and budget optimization."
readme = "README.md"
authors = [{ name = "AkshayByte", email = "akshayyadavji8@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.30",
    "networkx>=3.4.0",
    "uvicorn>=0.32.0",
    "alembic>=1.14.0",
    "groq>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "hypothesis>=6.120.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function call in default argument (FastAPI Depends pattern)
    "F403",   # star imports — used intentionally in seed_data.py
    "F405",   # may be undefined from star imports — seed_data.py pattern
    "F402",   # loop variable shadows import — cosmetic issue in tests
    "E402",   # module-level import not at top — alembic env.py pattern
    "B904",   # raise-without-from in except — deferred to future cleanup
    "B017",   # assert-raises-exception — acceptable in schema validation tests
    "UP042",  # replace-str-enum — intentional StrEnum usage
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "F401"]   # assert and unused imports allowed in tests
"backend/data/seeds/*" = ["F401", "F811"]  # seed_data uses star imports deliberately
